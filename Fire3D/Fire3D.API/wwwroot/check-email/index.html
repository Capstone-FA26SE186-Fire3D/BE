<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Xác minh email | FET3D</title>
  <style>
    body{margin:0;background:#f4f6f9;font:16px Arial,sans-serif;color:#202124}
    .card{max-width:480px;margin:9vh auto;background:#fff;padding:36px;border-radius:10px;box-shadow:0 2px 12px #0002}
    h1,button{color:#fff;background:#c62828}h1{margin:-36px -36px 28px;padding:24px;font-size:25px}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:5px}
    input{border:1px solid #bbb}button{border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
    #otp{letter-spacing:.35em;text-align:center;font-size:1.25rem}#status{min-height:24px;line-height:1.5}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>🔥 FET3D</h1>
    <h2>Xác minh email trước khi đăng ký</h2>
    <p>Nhập email để nhận mã xác minh gồm sáu chữ số. Mã có hiệu lực trong 10 phút.</p>
    <form id="request-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
      <button id="request-button" type="submit">Gửi mã xác minh</button>
    </form>
    <form id="verify-form" class="hidden">
      <label for="otp">Mã xác minh</label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="123456">
      <button id="verify-button" type="submit">Xác minh mã</button>
      <button id="resend-button" type="button" disabled>Gửi lại mã (60 giây)</button>
    </form>
    <p id="status" aria-live="polite"></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
