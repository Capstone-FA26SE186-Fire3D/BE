name: Processing regression

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  processing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fire3d-disposable-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIRE3D_TEST_ADMIN_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=fire3d-disposable-test
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=fire3d-disposable-test
      FIRE3D_TEST_REDIS_PORT: '6379'
      Jwt__SigningKey: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1taW5pbXVtLTEyMzQ1
      Jwt__Issuer: Fire3D.Tests
      Jwt__Audience: Fire3D.Tests.Client
      Mailgun__ApiKey: test-key
      Mailgun__Domain: example.test
      Mailgun__From: noreply@example.test
      # Placeholders: login resolves the S3 client, which needs a region; these tests never call S3.
      AWS__Region: ap-southeast-1
      AWS__AccessKey: test-only
      AWS__SecretKey: test-only
      AuthEmail__WorkerEnabled: 'false'
      Redis__Enabled: 'false'
      ProcessingWorker__DispatcherEnabled: 'false'
      ProcessingWorker__ConsumerEnabled: 'false'
      ProcessingWorker__WorkerApiEnabled: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare disposable services
        env:
          PGPASSWORD: fire3d-disposable-test
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE fire3d_api NOLOGIN NOSUPERUSER NOBYPASSRLS;'
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass fet3d-disposable-test
      - name: Test processing and readiness
        run: >-
          dotnet test Fire3D/Fire3D.AuthTests/Fire3D.AuthTests.csproj
          --filter 'FullyQualifiedName~Redis|FullyQualifiedName~ProcessingReadinessTests|FullyQualifiedName~Processing_readiness_uses|FullyQualifiedName~Ifc_process|FullyQualifiedName~Ifc_worker|FullyQualifiedName~Ifc_http_worker'
          --logger 'console;verbosity=minimal'
