name: Deploy staging
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fire3d-staging
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      DB_SECRET_VERSION: ${{ vars.DB_SECRET_VERSION }}
      JWT_SECRET_VERSION: ${{ vars.JWT_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        shell: bash
        run: |
          for name in GCP_PROJECT_ID GCP_REGION GCP_RUNTIME_SERVICE_ACCOUNT DB_SECRET_VERSION JWT_SECRET_VERSION; do
            test -n "${!name}" || { echo "Missing variable: $name"; exit 1; }
          done
          [[ "$DB_SECRET_VERSION" =~ ^[1-9][0-9]*$ && "$JWT_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
      - name: Build image
        run: docker build -t "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/fire3d/fire3d-api:$GITHUB_SHA" .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push and deploy
        shell: bash
        run: |
          set -euo pipefail
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/fire3d/fire3d-api:$GITHUB_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$image"
          gcloud run deploy fire3d-api-staging --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$image" --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 --concurrency 40 \
            --set-env-vars 'ASPNETCORE_ENVIRONMENT=Production,Database__ConnectionName=Supabase,Hosting__BehindTlsProxy=true' \
            --set-secrets "ConnectionStrings__Supabase=fire3d-supabase-connection:$DB_SECRET_VERSION,Jwt__SigningKey=fire3d-jwt-key:$JWT_SECRET_VERSION" \
            --quiet
          url=$(gcloud run services describe fire3d-api-staging --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
          echo "Staging deployed: $url" >> "$GITHUB_STEP_SUMMARY"
