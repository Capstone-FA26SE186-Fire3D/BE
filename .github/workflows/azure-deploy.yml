name: Build and Deploy to AWS

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fire3d-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: capstone-fa26se186-fire3d/fire3d-api
  # The API runs as a Docker container on an AWS EC2 host (docs/aws-ec2-deployment.md). Repository variable
  # AWS_BE_URL is its public HTTPS address; AWS_BE_HOST and AWS_BE_KNOWN_HOSTS with secret AWS_BE_SSH_KEY reach it.
  APP_URL: ${{ vars.AWS_BE_URL || 'https://52-221-57-57.sslip.io' }}

jobs:
  processing-regression:
    uses: ./.github/workflows/processing-tests.yml
    permissions:
      contents: read

  deployment-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployment preflight
        run: python -m unittest discover -s tools/deployment -p 'test_*.py'

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: [deployment-tests, processing-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fire3d-api-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preflight client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Fire3D/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Check candidate migrations before deployment
        env:
          DEPLOY_PREFLIGHT_CONNECTION: ${{ secrets.DEPLOY_PREFLIGHT_CONNECTION }}
        run: python tools/deployment/migration_preflight.py

      - name: Deploy to AWS EC2
        env:
          SSH_KEY: ${{ secrets.AWS_BE_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.AWS_BE_KNOWN_HOSTS }}
          HOST: ${{ vars.AWS_BE_HOST }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "${SSH_KEY}" || -z "${HOST}" || -z "${KNOWN_HOSTS}" ]]; then
            echo "Set secret AWS_BE_SSH_KEY and variables AWS_BE_HOST, AWS_BE_KNOWN_HOSTS (docs/aws-ec2-deployment.md)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: never trust whatever answers on first connect.
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          # The host pulls the image with its own read:packages login and restarts the container (fire3d-be-deploy).
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "ubuntu@${HOST}" \
            "sudo /usr/local/bin/fire3d-be-deploy '${IMAGE}' '${GITHUB_SHA::7}'"

      - name: Verify deployed version
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output version.json --write-out '%{http_code}' "${APP_URL}/health/version")" || status=000
            if [[ "${status}" == "200" ]] && jq --exit-status --arg version "${GITHUB_SHA}" '.version == $version' version.json >/dev/null 2>&1; then
              echo "Fire3D API is running ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for ${GITHUB_SHA}; attempt ${attempt}/30."
            sleep 10
          done
          echo "The server did not start the requested image version."
          exit 1

      - name: Smoke test deployed API
        shell: bash
        run: |
          # Post-deploy readiness supplements the pre-deploy migration gate.
          status="$(curl --silent --show-error --output ready.json --connect-timeout 10 --max-time 20 --write-out '%{http_code}' "${APP_URL}/health/ready")" || status=000
          cat ready.json || true
          echo
          if [[ "${status}" != "200" ]]; then
            echo "Readiness returned ${status}: inspect dependency health before accepting this deployment."
            exit 1
          fi
          # Invalid AI settings leave only AI off (readiness stays 200); surface them without failing the deploy.
          if jq -e '.checks.organizationAi.code == "AI_CONFIGURATION_INVALID"' ready.json > /dev/null 2>&1; then
            echo "::warning title=AI configuration invalid::$(jq -r '.checks.organizationAi.data.problem' ready.json) AI submits answer 503 until fixed."
          fi
          # The AI service itself not answering /ready (#185) also leaves only AI down.
          ai_code="$(jq -r '.checks.organizationAi.code // empty' ready.json 2>/dev/null || true)"
          if [[ "${ai_code}" == AI_PROVIDER_UNREACHABLE || "${ai_code}" == AI_PROVIDER_NOT_READY ]]; then
            echo "::warning title=AI service not ready::${ai_code} $(jq -r '.checks.organizationAi.data.providerStatus // empty' ready.json) - AI questions fail until the AI service answers /ready."
          fi
          # These anonymous endpoints must return 200; redirects, 401 and 404 also fail.
          for path in /api/learn/situations /api/learn/posts /openapi/v1.json; do
            # The OpenAPI document (about 280 operations) can take about 11 s to generate, so it gets a longer budget.
            limit=20; [[ "${path}" == /openapi/* ]] && limit=90
            status="$(curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time "${limit}" --write-out '%{http_code}' "${APP_URL}${path}")" || status=000
            echo "${path} -> ${status}"
            if [[ "${status}" != "200" ]]; then
              echo "Smoke test failed on ${path}."
              exit 1
            fi
          done
