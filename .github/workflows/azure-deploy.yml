name: Build and Deploy to Azure

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: fire3d-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: capstone-fa26se186-fire3d/fire3d-api
  # Repository variables AZURE_WEBAPP_NAME / AZURE_WEBAPP_URL pick the target App Service, so moving region
  # (docs/azure-region-move.md) changes settings only. Without them the workflow keeps the East Asia app.
  APP_URL: ${{ vars.AZURE_WEBAPP_URL || 'https://fire3d-api-h3a5h2fgdvajfbcz.eastasia-01.azurewebsites.net' }}
  WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'fire3d-api' }}

jobs:
  processing-regression:
    uses: ./.github/workflows/processing-tests.yml
    permissions:
      contents: read

  deployment-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployment preflight
        run: python -m unittest discover -s tools/deployment -p 'test_*.py'

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: [deployment-tests, processing-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fire3d-api-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preflight client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Fire3D/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Check candidate migrations before deployment
        env:
          DEPLOY_PREFLIGHT_CONNECTION: ${{ secrets.DEPLOY_PREFLIGHT_CONNECTION }}
        run: python tools/deployment/migration_preflight.py

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          restart: true

      - name: Verify deployed version
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output version.json --write-out '%{http_code}' "${APP_URL}/health/version")" || status=000
            if [[ "${status}" == "200" ]] && jq --exit-status --arg version "${GITHUB_SHA}" '.version == $version' version.json >/dev/null 2>&1; then
              echo "Fire3D API is running ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for ${GITHUB_SHA}; attempt ${attempt}/30."
            sleep 10
          done
          echo "Azure did not start the requested image version."
          exit 1

      - name: Smoke test deployed API
        shell: bash
        run: |
          # Post-deploy readiness supplements the pre-deploy migration gate.
          status="$(curl --silent --show-error --output ready.json --connect-timeout 10 --max-time 20 --write-out '%{http_code}' "${APP_URL}/health/ready")" || status=000
          cat ready.json || true
          echo
          if [[ "${status}" != "200" ]]; then
            echo "Readiness returned ${status}: inspect dependency health before accepting this deployment."
            exit 1
          fi
          # These anonymous endpoints must return 200; redirects, 401 and 404 also fail.
          for path in /api/learn/situations /api/learn/posts /openapi/v1.json; do
            # The OpenAPI document (about 280 operations) takes about 11 s to generate on the B1 plan, so it gets a longer budget.
            limit=20; [[ "${path}" == /openapi/* ]] && limit=90
            status="$(curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time "${limit}" --write-out '%{http_code}' "${APP_URL}${path}")" || status=000
            echo "${path} -> ${status}"
            if [[ "${status}" != "200" ]]; then
              echo "Smoke test failed on ${path}."
              exit 1
            fi
          done
