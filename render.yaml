services:
  - type: web
    name: fire3d-api
    runtime: docker
    # Build from BE/ so project references and database/ embedded resources are available.
    dockerfilePath: ./Fire3D/Dockerfile
    dockerContext: .
    # Render gọi endpoint này để kiểm tra service đã sẵn sàng chưa
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ── Database ────────────────────────────────────────────
      - key: ConnectionStrings__DefaultConnection
        sync: false   # Điền thủ công trên Render Dashboard

      # ── JWT ─────────────────────────────────────────────────
      - key: Jwt__SigningKey
        # Base64-encoded random key: at least 32 decoded bytes (openssl rand -base64 32).
        sync: false
      - key: Jwt__Issuer
        value: Fire3D.API
      - key: Jwt__Audience
        value: Fire3D.Clients
      - key: Jwt__AccessTokenMinutes
        value: "60"
      - key: Jwt__RefreshTokenDays
        value: "7"

      # ── Mailgun ─────────────────────────────────────────────
      - key: Mailgun__ApiKey
        sync: false   # Set on Render Dashboard (never commit API keys!)
      - key: Mailgun__Domain
        sync: false   # Set on Render Dashboard
      - key: Mailgun__From
        sync: false   # Set on Render Dashboard

      # ── Frontend URL (dùng trong link reset password) ───────
      - key: AuthEmail__FrontendUrl
        sync: false   # Điền thủ công: https://your-frontend.com

      # ── AWS S3 ──────────────────────────────────────────────
      - key: AWS__AccessKey
        sync: false
      - key: AWS__SecretKey
        sync: false
